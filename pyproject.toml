[project]
name = "ai-gateway-redteam"
version = "0.1.0"
description = "Security tests for the controls around AI models: gateway auth, network isolation, PII redaction"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aigw-redteam = "ai_gateway_redteam.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
